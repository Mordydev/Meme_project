---
# YOLO Mode Output Template
# Generates complete production-ready Veo 3 beats

metadata:
  title: "YOLO Complete Production Output"
  version: "1.0"
  generated: "[timestamp]"
  mode: "fully_automated"

sections:
  - name: "Project Overview"
    instruction: "Generate project summary from automated decisions"
    content: |
      # [PROJECT NAME - AUTO GENERATED]
      
      ## Concept
      - Original Input: [user's concept]
      - Processed Concept: [refined for production]
      - Content Type: [selected type]
      - Platform: [primary platform]
      - Keywords: [complete array]
      
      ## Automated Decisions
      - Viral Mechanic: [selected hook type]
      - Beat Structure: [selected structure]
      - Variation: [selected variation]
      - Enhancement Level: [applied enhancements]
      
      ## Success Projections
      - Engagement: [projected %]
      - Shares: [projected %]
      - Completion: [projected %]

  - name: "Character Lock"
    instruction: "Document complete character description for consistency"
    condition: "content_type == 'character'"
    content: |
      ## Character Bible (LOCKED)
      
      **Character ID**: [AUTO_GEN_ID]
      **Name**: [Generated name]
      **Demographics**: [age]-year-old [gender]
      
      **Complete Description** (Copy exactly to all beats):
      [Full appearance description including hair, clothing, accessories, distinguishing features]
      
      **Voice Profile**:
      - Tone: [selected tone]
      - Energy: [1-10]
      - Patterns: [speech characteristics]
      
      **Continuity Notes**:
      - Maintained across all beats
      - No variations permitted

  - name: "Beat 1 - Complete"
    instruction: "Generate complete first beat specification"
    content: |
      ## BEAT 1 - PRODUCTION READY
      
      ```json
      {
        "beat_id": "001_final",
        "duration": 8.0,
        "description": "[Complete one-sentence description]",
        "style": "[cinematic approach]",
        "keywords": ["16:9", "no text", "8 seconds", ...],
        "character": "[COMPLETE DESCRIPTION - Never shortened]",
        "camera": {
          "lens": "[specs]",
          "movement": "[exact]",
          "position": "[precise]"
        },
        "lighting": {
          "setup": "[complete]",
          "evolution": "[if any]"
        },
        "dialogue": {
          "text": "[final dialogue - no caps]",
          "timing": "[exact]",
          "delivery": "[specific notes]"
        },
        "audio": {
          "ambient": "[description] @ -18dB",
          "sfx": [list with timing],
          "music": "[if any] @ -15dB"
        },
        "timing_breakdown": {
          "0.0-2.0s": "[exact action]",
          "2.0-4.0s": "[exact action]",
          "4.0-6.0s": "[exact action]",
          "6.0-8.0s": "[exact action]"
        },
        "viral_element": "[specific moment @ timestamp]"
      }
      ```

  - name: "Beat 2 - Complete"
    instruction: "Generate complete second beat maintaining consistency"
    content: |
      ## BEAT 2 - PRODUCTION READY
      
      ```json
      {
        "beat_id": "002_final",
        "duration": 8.0,
        [Complete specification with IDENTICAL character description]
      }
      ```

  - name: "Beat 3 - Complete"
    instruction: "Generate complete third beat maintaining consistency"
    content: |
      ## BEAT 3 - PRODUCTION READY
      
