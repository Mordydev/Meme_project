  - name: "Transformation Details"
    instruction: "Document transformation choreography if applicable"
    condition: "content_type == 'transformation'"
    content: |
      ## Transformation Choreography
      
      **Type**: [logo_to_product/unboxing/environment_morph]
      
      **Synchronized Timeline**:
      - 0.0s: Visual trigger + Audio foundation
      - 1.5s: Dissolution/Opening + Chime/Burst
      - 3.0s: Convergence/Assembly + Crescendo
      - 5.5s: Stabilization + Environment fade-in
      - 8.0s: Hero shot + Resolution
      
