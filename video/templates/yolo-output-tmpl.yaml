      - Behavior: [description]
      - Convergence: [pattern]
      
      **Camera Pattern**: [macro_to_wide/orbital/dolly]

  - name: "Quick Prompts"
    instruction: "Generate copy-paste ready prompts"
    content: |
      ## Quick Generation Prompts
      
