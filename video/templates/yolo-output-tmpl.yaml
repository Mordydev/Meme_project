      ### Confidence Level
      - First generation success: [85%+]
      - Character consistency: [95%+]
      - Viral potential: [High/Medium]

  - name: "Decision Log"
    instruction: "Document all automated decisions for transparency"
    content: |
      ## YOLO Mode Decision Log
      
