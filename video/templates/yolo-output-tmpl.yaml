      [Streamlined prompt for quick copy-paste]
      ```
      
      ### BEAT 2
      ```
      [Streamlined prompt maintaining character]
      ```
      
      ### BEAT 3
      ```
      [Streamlined prompt maintaining character]
      ```

  - name: "Generation Instructions"
    instruction: "Provide step-by-step generation guidance"
    content: |
      ## Veo 3 Generation Steps
      
      1. **Beat 1 Generation**
         - Generate with 3 different seeds
         - Select best result
         - Note seed: _______
      
      2. **Beat 2 Generation**
         - Use seed from Beat 1 (if same character)
