name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    services:
      # Database services for testing
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run frontend unit tests
        run: npm run test:unit -- --coverage
      
      - name: Upload frontend coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./apps/frontend/coverage
          flags: frontend
      
      - name: Run backend unit tests
        run: cd apps/backend && npm test -- --coverage
      
      - name: Upload backend coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./apps/backend/coverage
          flags: backend

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only run E2E tests on main/develop branches to save CI resources
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium
      
      - name: Build frontend
        run: npm run build
      
      - name: Run E2E tests
        run: npm run test:e2e:chrome
      
      - name: Upload test artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7