version: '3.8'
services:
  backend:
    build:
      context: ../../
      dockerfile: docker/development/Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://dev:dev@postgres:5432/successKidPlatform
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-secret
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    command: pnpm --filter @success-kid/backend dev

  postgres:
    image: postgres:17.2
    environment:
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=dev
      - POSTGRES_DB=successKidPlatform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../docker/development/init-scripts/postgres:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d successKidPlatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
