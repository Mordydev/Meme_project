<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline | Success Kid Community</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      background-color: #F5F7FA;
      color: #212121;
    }
    .container {
      max-width: 500px;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 2rem;
    }
    h1 {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      margin-bottom: 2rem;
      font-size: 1.1rem;
      line-height: 1.5;
      color: #757575;
    }
    .button {
      display: inline-block;
      background-color: #1E88E5;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .button:hover {
      background-color: #1976D2;
    }
    .kid-image {
      max-width: 200px;
      margin: 2rem 0;
    }
    .notification {
      background-color: #FFF9C4;
      border-radius: 8px;
      padding: 16px;
      margin-top: 2rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/images/logo.png" alt="Success Kid Logo" class="logo" onerror="this.style.display='none'">
    <h1>You're Currently Offline</h1>
    <p>Don't worry! The Success Kid Community will be here when your connection returns.</p>
    
    <img src="/images/icons/success-kid-offline.svg" alt="Success Kid Offline" class="kid-image" onerror="this.style.display='none'">
    
    <a href="/" class="button">Try Again</a>
    
    <div class="notification">
      <strong>Pro Tip:</strong> You can still view cached content while offline. Some features might be limited until you're back online.
    </div>
  </div>
  
  <script>
    // Check if we're back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
    
    // Try to reload every 30 seconds
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 30000);
  </script>
</body>
</html>
