<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Success Kid Community</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1E88E5">
  <style>
    :root {
      --color-primary: #1E88E5;
      --color-secondary: #FFC107;
      --color-background: #F5F7FA;
      --color-text: #212121;
      --color-gray: #757575;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: var(--color-background);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 1rem;
    }
    
    .offline-container {
      max-width: 480px;
      margin: 2rem auto;
      padding: 2rem;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    
    .offline-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 1.5rem;
      background-color: #EEE;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--color-text);
    }
    
    p {
      color: var(--color-gray);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    
    .button {
      display: inline-block;
      background-color: var(--color-primary);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    
    .button:hover {
      background-color: #1976D2;
    }
    
    .cached-content {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid #EEE;
    }
    
    .content-list {
      list-style: none;
      text-align: left;
      margin-top: 1rem;
    }
    
    .content-list li {
      padding: 0.75rem 0;
      border-bottom: 1px solid #EEE;
    }
    
    .content-list a {
      color: var(--color-primary);
      text-decoration: none;
    }
    
    .footer {
      margin-top: auto;
      text-align: center;
      font-size: 0.875rem;
      color: var(--color-gray);
      padding: 1rem 0;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1.5 9L4.5 12M7.5 15L10.5 18M13.5 9L16.5 12M19.5 15L22.5 18M4.5 12C6.5 10 8.5 9 12 9C15.5 9 17.5 10 19.5 12M10.5 18C11.24 17.26 12.76 17.26 13.5 18M12 4.5V5.25" stroke="#757575" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 3L21 21" stroke="#F44336" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    
    <h1>You're offline</h1>
    <p>The content you're trying to access isn't available offline. Please check your connection and try again.</p>
    
    <a href="/" class="button">Try Again</a>
    
    <div class="cached-content">
      <h2>Available Offline</h2>
      <p>You can still access these parts of the app:</p>
      
      <ul class="content-list">
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/profile">My Profile</a></li>
        <li><a href="/community">Previously Viewed Content</a></li>
      </ul>
    </div>
  </div>
  
  <div class="footer">
    Success Kid Community Platform
  </div>
  
  <script>
    // Check for network status changes
    window.addEventListener('online', () => {
      // Reload the page when we come back online
      window.location.reload();
    });
    
    // Check if service worker is registered
    if ('serviceWorker' in navigator) {
      // Attempt to update the service worker
      navigator.serviceWorker.ready.then(registration => {
        registration.update();
      });
    }
  </script>
</body>
</html>
